{{- /* generic ingress resource */ -}}
{{- define "statefull.ingress.resource" -}}
{{- $ := .ctx }}
{{- $ingressName := .name }}
{{- $secretName := .secretName }}
{{- $domains := .domains }}
{{- $annotations := .annotations }}
{{- $fullName := include "statefull.fullname" $ }}
{{- $kVer := $.Capabilities.KubeVersion.GitVersion }}
{{- $svcName := include "statefull.servicename" $ }}
{{- $svcPort := $.Values.ingress.servicePort }}
---
{{- if semverCompare ">=1.19.0-0" $kVer }}
apiVersion: networking.k8s.io/v1
{{- else }}
apiVersion: networking.k8s.io/v1beta1
{{- end }}
kind: Ingress

metadata:
  name: {{ $ingressName }}
  labels:
{{ include "statefull.labels" $ | indent 4 }}
  annotations:
  {{- with $annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if and $.Values.ingress.tls.enabled $.Values.ingress.tls.letsEncrypt.enabled }}
    cert-manager.io/cluster-issuer: {{ $.Values.ingress.tls.letsEncrypt.issuer }}
  {{- end }}

spec:
  ingressClassName: {{ $.Values.ingress.ingressClassName | quote }}

  {{- if $.Values.ingress.tls.enabled }}
  tls:
  - hosts:
  {{- range $domain := $domains }}
    {{- $host := include "statefull.ingress.fqdn" (dict "ctx" $ "domain" $domain) }}
    - {{ $host | quote }}
  {{- end }}
    secretName: {{ $secretName | quote }}
  {{- end }}

  rules:
  {{- range $domain := $domains }}
    {{- $host := include "statefull.ingress.fqdn" (dict "ctx" $ "domain" $domain) }}
    - host: {{ $host | quote }}
      http:
        paths:
        {{- range $entry := $.Values.ingress.paths }}
          {{- $parsed := include "statefull.ingress.normalizePath" (dict "entry" $entry "defaultPort" $svcPort "serviceName" $svcName) | fromYaml }}
          {{- $path := index $parsed "path" }}
          {{- $serviceName := index $parsed "serviceName" }}
          {{- $portObj := index $parsed "port" }}
          {{- $portNumber := index $portObj "number" }}
          {{- $portName := index $portObj "name" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              {{- if semverCompare ">=1.19.0-0" $kVer }}
              service:
                name: {{ $serviceName }}
                port:
                  {{- if $portNumber }}
                  number: {{ $portNumber }}
                  {{- else if $portName }}
                  name: {{ $portName }}
                  {{- else }}
                  number: {{ $svcPort }}
                  {{- end }}
              {{- else }}
              serviceName: {{ $serviceName }}
              {{- if $portNumber }}
              servicePort: {{ $portNumber }}
              {{- else if $portName }}
              servicePort: {{ $portName }}
              {{- else }}
              servicePort: {{ $svcPort }}
              {{- end }}
              {{- end }}
        {{- end }}
  {{- end }}
{{- end }}

{{- if and .Values.ingress.enabled (eq .Values.ingress.ingressClassName "alb") }}

{{- /* generate main ingess */ -}}
{{- $mainName := include "statefull.fullname" . }}
{{- $mainSecret := include "statefull.ingress.secretName" . }}
{{- include "statefull.ingress.resource" (dict "ctx" . "name" $mainName "secretName" $mainSecret "domains" .Values.ingress.rootDomains "annotations" .Values.ingress.annotations) }}
{{- end }}

{{- /* generate extra ingess */ -}}
{{- range $extra := .Values.ingress.extraDomains }}
  {{- if $extra.enabled }}
    {{- $extraName := printf "%s-%s" (include "statefull.fullname" $) $extra.name }}
    {{- $extraSecret := printf "%s-%s" $extra.name (include "statefull.ingress.secretName" $) }}
    
    {{- $baseAnnotations := default dict $.Values.ingress.annotations }}
    
    {{- $customOverrides := dict }}
    {{- if $extra.target }}
      {{- $_ := set $customOverrides "external-dns.alpha.kubernetes.io/target" $extra.target }}
      {{- $_ := set $customOverrides "external-dns.alpha.kubernetes.io/cloudflare-proxied" "false" }}
    {{- end }}
    {{- if $extra.group }}
      {{- $_ := set $customOverrides "alb.ingress.kubernetes.io/group.name" $extra.group }}
    {{- end }}
    
    {{- $mergedAnnotations := merge $customOverrides $baseAnnotations }}
    {{- $extraDomainsList := list $extra.domain }}

    {{- include "statefull.ingress.resource" (dict "ctx" $ "name" $extraName "secretName" $extraSecret "domains" $extraDomainsList "annotations" $mergedAnnotations) }}
  {{- end }}
{{- end }}

